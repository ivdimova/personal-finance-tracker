<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Personal Finance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            background: #667eea;
            color: white;
        }
        
        .filters {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-group label {
            font-weight: bold;
            color: #333;
        }
        
        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        
        .filter-group select:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .summary-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: none;
        }
        
        .summary-section.visible {
            display: block;
        }
        
        .summary-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
        }
        
        .transactions-table {
            background: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .table-header {
            background: #667eea;
            color: white;
            padding: 15px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 15px;
            font-weight: bold;
        }
        
        .transaction-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }
        
        .transaction-row:hover {
            background: #f0f4ff;
        }
        
        .transaction-row:last-child {
            border-bottom: none;
        }
        
        .amount-positive {
            color: #27ae60;
            font-weight: bold;
        }
        
        .amount-negative {
            color: #e74c3c;
            font-weight: bold;
        }
        
        .category-tag {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            display: inline-block;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        
        .no-transactions {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .table-header,
            .transaction-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            
            .table-header > div,
            .transaction-row > div {
                text-align: left;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-link">← Back to Main App</a>
        
        <div class="header">
            <h1>💳 Transaction History</h1>
            <p class="subtitle">View and filter your transactions</p>
        </div>
        
        <div class="filters">
            <div class="filter-group">
                <label for="categoryFilter">Filter by Category:</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>
        
        <div id="summarySection" class="summary-section">
            <div class="summary-title" id="summaryTitle">Category Summary</div>
            <div class="summary-stats">
                <div class="stat-item">
                    <div class="stat-label">Total Transactions</div>
                    <div class="stat-value" id="transactionCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Income</div>
                    <div class="stat-value" id="incomeTotal">€0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Expenses</div>
                    <div class="stat-value" id="expenseTotal">€0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Net Amount</div>
                    <div class="stat-value" id="netAmount">€0.00</div>
                </div>
            </div>
        </div>
        
        <div id="loading" class="loading">Loading transactions...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="transactionsContainer" style="display: none;">
            <div class="transactions-table">
                <div class="table-header">
                    <div>Description</div>
                    <div>Date</div>
                    <div>Amount</div>
                    <div>Category</div>
                    <div>Account</div>
                </div>
                <div id="transactionsList">
                </div>
            </div>
        </div>
        
        <div id="noTransactions" class="no-transactions" style="display: none;">
            No transactions found. Upload a CSV file to get started!
        </div>
    </div>

    <script>
        let allTransactions = [];
        let allCategories = [];
        
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                allCategories = await response.json();
                const categorySelect = document.getElementById('categoryFilter');
                
                // Clear existing options except "All Categories"
                categorySelect.innerHTML = '<option value="">All Categories</option>';
                
                // Add category options
                allCategories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.name;
                    option.textContent = category.name;
                    categorySelect.appendChild(option);
                });
                
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        async function loadTransactions(category = '') {
            try {
                const url = category ? `/api/transactions?category=${encodeURIComponent(category)}` : '/api/transactions';
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                allTransactions = data.transactions;
                
                // Update summary section
                if (category && data.summary) {
                    updateSummary(data.summary, category);
                    document.getElementById('summarySection').classList.add('visible');
                } else {
                    document.getElementById('summarySection').classList.remove('visible');
                }
                
                displayTransactions(allTransactions);
                
                document.getElementById('loading').style.display = 'none';
                
                if (allTransactions.length > 0) {
                    document.getElementById('transactionsContainer').style.display = 'block';
                    document.getElementById('noTransactions').style.display = 'none';
                } else {
                    document.getElementById('transactionsContainer').style.display = 'none';
                    document.getElementById('noTransactions').style.display = 'block';
                }
                
            } catch (error) {
                console.error('Error loading transactions:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error loading transactions: ${error.message}`;
            }
        }
        
        function updateSummary(summary, category) {
            document.getElementById('summaryTitle').textContent = `${category} - Summary`;
            document.getElementById('transactionCount').textContent = summary.transaction_count;
            document.getElementById('incomeTotal').textContent = `€${summary.income_total.toFixed(2)}`;
            document.getElementById('expenseTotal').textContent = `€${summary.expense_total.toFixed(2)}`;
            document.getElementById('netAmount').textContent = `€${summary.net_amount.toFixed(2)}`;
            
            // Color net amount based on positive/negative
            const netElement = document.getElementById('netAmount');
            if (summary.net_amount >= 0) {
                netElement.style.color = '#27ae60';
            } else {
                netElement.style.color = '#e74c3c';
            }
        }
        
        function displayTransactions(transactions) {
            const container = document.getElementById('transactionsList');
            container.innerHTML = '';
            
            transactions.forEach(transaction => {
                const row = document.createElement('div');
                row.className = 'transaction-row';
                
                const amount = parseFloat(transaction.amount);
                const amountClass = amount >= 0 ? 'amount-positive' : 'amount-negative';
                const amountText = amount >= 0 ? `+€${amount.toFixed(2)}` : `-€${Math.abs(amount).toFixed(2)}`;
                
                row.innerHTML = `
                    <div>${transaction.description || 'N/A'}</div>
                    <div>${new Date(transaction.date).toLocaleDateString()}</div>
                    <div class="${amountClass}">${amountText}</div>
                    <div>
                        ${transaction.category ? `<span class="category-tag">${transaction.category}</span>` : 'Uncategorized'}
                    </div>
                    <div>${transaction.account || 'N/A'}</div>
                `;
                
                container.appendChild(row);
            });
        }
        
        // Event listeners
        document.getElementById('categoryFilter').addEventListener('change', function(e) {
            const selectedCategory = e.target.value;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('transactionsContainer').style.display = 'none';
            document.getElementById('noTransactions').style.display = 'none';
            loadTransactions(selectedCategory);
        });
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            await loadCategories();
            await loadTransactions();
        });
    </script>
</body>
</html>
